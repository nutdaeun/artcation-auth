type: object
description: >
  공통 에러 응답 형태(ApiResponse.fail). code는 프론트 분기용 에러 코드,
  message는 각 spec 문서의 "표시" 문구다. data는 null이라 응답에서 제외된다.
required:
  - code
  - message
properties:
  code:
    type: string
    description: 에러 코드. 프론트는 message가 아니라 이 값으로 분기한다
    example: INVALID_INPUT
  message:
    type: string
    example: 요청을 처리할 수 없습니다
